[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-format-table"
version = "2.0.0"
description = "Decimal aligned text and LaTeX tables with significant-figure control."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Scott Hendrickson", email = "scott@drskippy.net" }]
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
csv2table = "text_format_table.cli:main"

[tool.setuptools]
packages = ["text_format_table"]

[tool.setuptools.package-data]
text_format_table = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=text_format_table --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D"]
# keep explicit if/else blocks where they carry explanatory comments
ignore = ["SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"FNumber.py" = ["N999"]
"FormatTable.py" = ["N999"]

[tool.mypy]
strict = true
files = ["text_format_table"]
